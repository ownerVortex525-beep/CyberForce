<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Console — CyberForce</title>
  <link rel="stylesheet" href="css/style.css" onerror="this.onerror=null;this.href='style.css';">
  <style>
    .login-wrap{display:flex;align-items:center;justify-content:center;padding:80px 20px}
    .login-card{width:100%;max-width:420px;background:linear-gradient(160deg,#161f2a,#10161d);border:1px solid var(--border);border-radius:14px;padding:36px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
    .login-card .shield{font-size:2.2rem}
    .login-card h2{font-family:var(--font-head);letter-spacing:.5px;margin:10px 0 4px}
    .login-card p{color:var(--muted);font-size:.9rem;margin-bottom:20px}
    .admin-wrap{max-width:1000px;margin:0 auto;padding:30px 20px 60px}
    .dash-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    .dash-title{font-family:var(--font-head);font-size:1.5rem;letter-spacing:.5px}
    .dash-title span{color:var(--accent)}
    .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .stat{position:relative;background:linear-gradient(160deg,#18222e,#121a23);border:1px solid var(--border);border-radius:12px;padding:18px;overflow:hidden}
    .stat::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),transparent)}
    .stat b{font-size:1.8rem;font-family:var(--font-head)}
    .stat span{display:block;color:var(--muted);font-size:.74rem;margin-top:2px;letter-spacing:.5px;text-transform:uppercase}
    .stat .ico{position:absolute;right:14px;top:14px;font-size:1.1rem}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
    .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
    .panel h3{font-family:var(--font-head);letter-spacing:.4px;margin-bottom:14px}
    .bar-row{display:flex;align-items:center;gap:10px;margin:9px 0;font-size:.86rem}
    .bar-label{min-width:130px;color:var(--muted)}
    .bar{height:9px;background:var(--bg-soft);border-radius:5px;flex:1;overflow:hidden}
    .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:5px}
    .bar-num{min-width:32px;text-align:right}
    .full{grid-column:1/-1}
    table{width:100%;border-collapse:collapse;font-size:.85rem}
    th,td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:left}
    th{color:var(--muted);font-weight:600;text-transform:uppercase;font-size:.72rem;letter-spacing:.5px}
    tr:hover td{background:rgba(53,201,227,.04)}
    .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:.72rem;border:1px solid var(--border);color:var(--muted)}
    .badge.ok{border-color:#16a34a;color:#4ade80}
    .badge.warn{border-color:var(--danger);color:#f87171}
    .btn-small{padding:8px 14px;font-size:.85rem}
    .muted{color:var(--muted);font-size:.8rem;margin-top:12px}
    @media(max-width:800px){.stat-grid{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}}
  </style>
</head>
<body>

  <header class="navbar">
  <div class="nav-inner">
    <a class="brand" href="index.html">
      <img src="assets/logo.png" alt="CyberForce" class="brand-logo" onerror="this.style.display='none'">
      <span class="brand-name">CYBER<em>FORCE</em></span>
      <span class="brand-tag">Case Report System</span>
    </a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="report.html">Create Report</a>
      <a href="verify.html">Verify</a>
      <a href="my-reports.html">My Reports</a>
      <a href="rules.html">Rules</a>
    </nav>
  </div>
</header>

  <!-- LOGIN -->
  <div class="login-wrap" id="loginBox">
    <div class="login-card">
      <div class="shield">🛡️</div>
      <h2>Admin Console</h2>
      <p>Authorized officer access only.</p>
      <div class="field"><input id="passInput" type="password" placeholder="Passcode"></div>
      <button class="btn btn-primary" id="loginBtn" style="width:100%">Login</button>
      <p class="muted">All monitoring is anonymous. No personal data is collected.</p>
    </div>
  </div>

  <!-- DASHBOARD -->
  <main class="admin-wrap" id="dash" style="display:none">
    <div class="dash-head">
      <h2 class="dash-title">Cyber<span>Force</span> Admin Console</h2>
      <div>
        <button class="btn btn-secondary btn-small" id="refreshBtn">⟳ Refresh</button>
        <button class="btn btn-secondary btn-small" id="logoutBtn">Logout</button>
      </div>
    </div>
    <div class="stat-grid" id="statGrid"></div>
    <div class="cols">
      <div class="panel"><h3>🚨 Crime Type Trends</h3><div id="crimeBars"></div></div>
      <div class="panel"><h3>📤 Export Format Usage</h3><div id="exportBars"></div></div>
      <div class="panel full"><h3>🕒 Recent Events (Last 20)</h3>
        <table><thead><tr><th>Time</th><th>Event</th><th>Label</th></tr></thead><tbody id="evTable"></tbody></table>
      </div>
    </div>
  </main>

  <script>
    /* ====== CONFIG ====== */
    const ADMIN_PASS = 'cyberforce2026';   // login passcode (change if you want)
    const SHEET_URL  = '';                 // your Apps Script web app URL
    const ADMIN_KEY  = 'cyberforce2026';   // must match Apps Script key

    const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

    document.getElementById('loginBtn').addEventListener('click', () => {
      if (document.getElementById('passInput').value === ADMIN_PASS) {
        sessionStorage.setItem('cf_admin', '1'); showDash();
      } else alert('Wrong passcode!');
    });
    document.getElementById('logoutBtn').addEventListener('click', () => { sessionStorage.removeItem('cf_admin'); location.reload(); });

    function showDash(){
      document.getElementById('loginBox').style.display = 'none';
      document.getElementById('dash').style.display = 'block';
      loadData();
    }
    if (sessionStorage.getItem('cf_admin')) showDash();

    async function loadData(){
      if (!SHEET_URL) { alert('Set SHEET_URL (Apps Script URL) in admin.html first.'); return; }
      try {
        const res = await fetch(SHEET_URL + '?key=' + ADMIN_KEY);
        const data = await res.json();
        if (data.error) { alert('Unauthorized — check ADMIN_KEY.'); return; }
        render(data);
      } catch (e) { alert('Data load failed: ' + e.message); }
    }
    document.getElementById('refreshBtn').addEventListener('click', loadData);

    function badge(e){
      if (e === 'verify_ok' || e.indexOf('export') === 0 || e === 'print') return 'ok';
      if (e === 'verify_fail') return 'warn';
      return '';
    }

    function render(data){
      const c = {};
      data.forEach(r => c[r.e] = (c[r.e] || 0) + 1);
      const stats = [
        ['📝','Report Started', c['report_started'] || 0], ['✅','Completed', c['report_completed'] || 0],
        ['📄','PDF Export', c['export_pdf'] || 0], ['📃','DOC Export', c['export_docx'] || 0],
        ['🖨️','Print', c['print'] || 0], ['🔍','Verify OK', c['verify_ok'] || 0],
        ['','Verify Fail', c['verify_fail'] || 0], ['⚡','Total Events', data.length]
      ];
      document.getElementById('statGrid').innerHTML = stats.map(s =>
        `<div class="stat"><span class="ico">${s[0]}</span><b>${s[2]}</b><span>${s[1]}</span></div>`).join('');

      const crime = {};
      data.forEach(r => { if (['report_completed','export_pdf','export_docx'].includes(r.e) && r.l) crime[r.l] = (crime[r.l] || 0) + 1; });
      document.getElementById('crimeBars').innerHTML = bars(crime) || '<p class="muted">No data yet.</p>';

      document.getElementById('exportBars').innerHTML = bars({ 'PDF': c['export_pdf'] || 0, 'DOC': c['export_docx'] || 0, 'Print': c['print'] || 0 });

      const last = data.slice(-20).reverse();
      document.getElementById('evTable').innerHTML = last.map(r =>
        `<tr><td>${esc(new Date(r.t).toLocaleString())}</td><td><span class="badge ${badge(r.e)}">${esc(r.e)}</span></td><td>${esc(r.l) || '—'}</td></tr>`
      ).join('') || '<tr><td colspan="3">No events yet.</td></tr>';
    }

    function bars(obj){
      const max = Math.max(...Object.values(obj), 1);
      return Object.entries(obj).sort((a,b) => b[1]-a[1]).map(([k,v]) =>
        `<div class="bar-row"><span class="bar-label">${esc(k)}</span><div class="bar"><i style="width:${Math.round(v/max*100)}%"></i></div><span class="bar-num">${v}</span></div>`
      ).join('');
    }
  </script>

</body>
</html>
